  <dialog class="lightbox" id="lightbox">
    <button type="button" class="lightbox-close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="">
    <p id="lightbox-cap"></p>
  </dialog>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    const box = document.getElementById("lightbox");
    const boxImg = document.getElementById("lightbox-img");
    const boxCap = document.getElementById("lightbox-cap");

    document.querySelectorAll(".photo-open").forEach(btn => {
      btn.addEventListener("click", () => {
        const img = btn.querySelector("img");
        const fig = btn.closest("figure");
        const title = fig.querySelector(".photo-title");
        const meta = fig.querySelector(".photo-meta");
        boxImg.src = img.src;
        boxImg.alt = img.alt;
        boxCap.textContent = (title ? title.textContent : "") + (meta ? " (" + meta.textContent + ")" : "");
        box.showModal();
      });
    });
    box.querySelector(".lightbox-close").addEventListener("click", () => box.close());
    box.addEventListener("click", e => { if (e.target === box) box.close(); });
  </script>
